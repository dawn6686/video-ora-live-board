name: Update Semifinal Snapshot & Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  schedule:
    # 每 10 分钟自动拉取一次官方半决赛接口，更新快照并部署到 GitHub Pages
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest Semifinal & Round2 data and update snapshot
        continue-on-error: true
        run: python scripts/update_snapshot.py

      - name: Commit updated snapshot & history back to repo (only if changed)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/snapshot.js data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(snapshot): update semifinal leaderboard snapshot [skip ci]"
            git pull --rebase origin main || true
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
